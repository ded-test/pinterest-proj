services:
  postgres:
    image: postgres:15
    container_name: postgres_db_pinterest
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis_db_pinterest
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASS} --bind 0.0.0.0
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: always
  rabbitmq:
    image: rabbitmq:4.2-rc-management  
    hostname: rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest} 
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest} 
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}    
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: always 

  

volumes:
  postgres_data:
  redis_data:
  rabbitmq-data:
